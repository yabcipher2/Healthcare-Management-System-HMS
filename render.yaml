services:
  # ── Backend API (Node/Express + MongoDB Atlas) ─────────────────────────────
  - type: web
    name: hms-backend
    runtime: node
    region: oregon
    plan: free
    branch: full
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Comma-separated origins allowed to call the API, e.g.
      # https://hms-frontend.onrender.com — leave empty to allow any origin.
      - key: CLIENT_ORIGIN
        sync: false
    healthCheckPath: /api/health

  # ── Frontend (Vite/React static site, served from Render's CDN) ────────────
  - type: web
    name: hms-frontend
    runtime: static
    branch: full
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Baked into the bundle at build time — set this to the backend URL,
      # e.g. https://hms-backend.onrender.com (no trailing slash, no /api).
      - key: VITE_API_URL
        sync: false
    routes:
      # Serve index.html for client-side paths so refreshes/deep links work.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
